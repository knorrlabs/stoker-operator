name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  SCANNER_VERSION: v0.76.2

jobs:
  build-images:
    strategy:
      matrix:
        image_name: [stoker-operator, stoker-agent]
        arch: [amd64, arm64]
        include:
          - image_name: stoker-operator
            file: Dockerfile
          - image_name: stoker-agent
            file: Dockerfile.agent
            no_cache_filters: runtime
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}:buildcache-${{ matrix.arch }},mode=max
          # A cached apk layer kept 0.8.3's vulnerable openssh until the base image changed (#277).
          no-cache-filters: ${{ matrix.no_cache_filters }}

      - name: Scan pushed image, all severities
        # Pinned by SHA: this action's tags were hijacked in March 2026.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}@${{ steps.build.outputs.digest }}
          version: ${{ env.SCANNER_VERSION }}
          scanners: vuln
          vuln-type: os,library
          format: json
          output: trivy-all.json

      - name: Write run summary
        shell: bash
        env:
          HEADING: ${{ matrix.image_name }} ${{ steps.version.outputs.version }} ${{ matrix.platform }}
        run: hack/trivy-summary.sh trivy-all.json "$HEADING" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Scan pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}@${{ steps.build.outputs.digest }}
          version: ${{ env.SCANNER_VERSION }}
          skip-setup-trivy: true
          cache: false
          scanners: vuln
          vuln-type: os,library
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.image_name }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.image_name }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image_name }}-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.image_name }}
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    runs-on: ubuntu-latest
    needs: build-images
    strategy:
      matrix:
        include:
          - image_name: stoker-operator
          - image_name: stoker-agent
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-${{ matrix.image_name }}-amd64
          path: /tmp/digests

      - name: Download arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-${{ matrix.image_name }}-arm64
          path: /tmp/digests

      - name: Create multi-arch manifest
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}
          VERSION=${{ steps.version.outputs.version }}
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " $(ls /tmp/digests/))

  publish-chart:
    runs-on: ubuntu-latest
    needs: merge-manifests
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Log in to GHCR for Helm
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update Chart.yaml version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" charts/stoker-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.version }}\"/" charts/stoker-operator/Chart.yaml

      - name: Package and push Helm chart
        run: |
          helm package charts/stoker-operator
          helm push stoker-operator-${{ steps.version.outputs.version }}.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

  github-release:
    runs-on: ubuntu-latest
    needs: merge-manifests
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
