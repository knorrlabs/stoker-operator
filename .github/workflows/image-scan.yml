name: Image scan

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/image-scan.yml
      - hack/trivy-summary.sh

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  SCANNER_VERSION: v0.76.2

jobs:
  scan:
    name: scan ${{ matrix.image_name }} ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image_name: [stoker-operator, stoker-agent]
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Resolve latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Scan all severities
        # Pinned by SHA: this action's tags were hijacked in March 2026.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:${{ steps.release.outputs.version }}
          version: ${{ env.SCANNER_VERSION }}
          scanners: vuln
          vuln-type: os,library
          format: json
          output: trivy-all.json

      - name: Write run summary
        env:
          HEADING: ${{ matrix.image_name }} ${{ steps.release.outputs.version }} ${{ matrix.platform }}
        run: hack/trivy-summary.sh trivy-all.json "$HEADING" >> "$GITHUB_STEP_SUMMARY"

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:${{ steps.release.outputs.version }}
          version: ${{ env.SCANNER_VERSION }}
          skip-setup-trivy: true
          scanners: vuln
          vuln-type: os,library
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload to code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy/${{ matrix.image_name }}/${{ matrix.platform }}
