name: Image scan

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/image-scan.yml
      - .github/actions/trivy-scan/**

permissions:
  contents: read

jobs:
  scan:
    name: scan ${{ matrix.image_name }} ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image_name: [stoker-operator, stoker-agent]
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Resolve latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Scan
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:${{ steps.release.outputs.version }}
          platform: ${{ matrix.platform }}
          heading: ${{ matrix.image_name }} ${{ steps.release.outputs.version }} ${{ matrix.platform }}
          sarif-output: trivy.sarif

      - name: Upload to code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy/${{ matrix.image_name }}/${{ matrix.platform }}
