name: Dependabot automerge

# Dependabot security updates own the surfaces Renovate does not extract
# (indirect Go modules, lockfile-only npm packages), so Renovate's automerge
# policy never sees them. This applies the same policy from the shared
# knorrlabs/renovate-config preset: everything under /docs, patch updates, and
# minor updates for packages at 1.0 or later. Majors outside /docs stay
# reviewed. GitHub auto-merge only merges once the ruleset's required checks
# pass, so nothing lands untested.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      # go-git is excluded to match .github/renovate.json: e2e does not run on
      # PRs, so clone-path changes get a deliberate review.
      - name: Enable auto-merge
        if: >-
          !contains(steps.meta.outputs.dependency-names, 'go-git')
          && (steps.meta.outputs.directory == '/docs'
              || steps.meta.outputs.update-type == 'version-update:semver-patch'
              || (steps.meta.outputs.update-type == 'version-update:semver-minor'
                  && !startsWith(steps.meta.outputs.previous-version, '0.')))
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
